name: Deploy to GitHub Pages

# Nothing builds by itself (the user, 2026-10-28: "i dont ever want an automatic build of anything i only want
# stuff to build when i say so"): no push or schedule trigger. The site is built by hand (the Actions page's
# "Run workflow", or `gh workflow run deploy.yml`), or by the ping of a release the user started.
on:
  workflow_dispatch:
  # just-house-paint's release workflow (its notify-website job) when a release is published. The prebuild step
  # in package.json fetches that release's docs.tar.gz, so the site rebuilds with the new docs.
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
